<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="MediDocs is a calm, reliable home for the health documents that matter."
    />
    <meta name="theme-color" content="#e8eee8" />
    <title>MediDocs — your health documents, held with care</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main>
      <nav aria-label="Primary navigation">
        <a class="brand" href="/" aria-label="MediDocs home">
          <span class="brand-mark" aria-hidden="true">
            <span></span>
            <span></span>
          </span>
          MediDocs
        </a>
        <a class="quiet-link" href="https://app.medidocs.sk">Open your space</a>
      </nav>

      <section class="hero">
        <div class="copy">
          <p class="eyebrow">Your health, quietly organized</p>
          <h1>A reliable space for the documents that tell your health story.</h1>
          <p class="intro">
            Because the most important record in our lives deserves to feel clear,
            calm, and close at hand.
          </p>
          <a class="cta" href="https://app.medidocs.sk">
            Enter MediDocs
            <span aria-hidden="true">↗</span>
          </a>
        </div>

        <div class="zen-scene" aria-hidden="true">
          <div class="sun"></div>
          <div class="orb orb-one"></div>
          <div class="orb orb-two"></div>
          <div class="paper paper-back">
            <span></span><span></span><span></span>
          </div>
          <div class="paper paper-front">
            <div class="paper-symbol">
              <i></i><i></i>
            </div>
            <span></span><span></span><span></span><span></span>
          </div>
          <div class="stone stone-one"></div>
          <div class="stone stone-two"></div>
          <svg class="leaf" viewBox="0 0 260 330">
            <path d="M222 16C101 56 53 159 52 307" />
            <path d="M190 67c-45-5-72 15-91 53 44 7 75-9 91-53Z" />
            <path d="M142 132c-45-3-72 20-84 59 43 4 70-14 84-59Z" />
            <path d="M99 204c-38 7-57 31-58 68 37-6 56-28 58-68Z" />
          </svg>
          <div class="ripple ripple-one"></div>
          <div class="ripple ripple-two"></div>
        </div>
      </section>

      <footer>
        <span>Made with care in Slovakia</span>
        <span>© <span id="year"></span> MediDocs</span>
      </footer>
    </main>
    <script src="/script.js"></script>
  </body>
</html>
