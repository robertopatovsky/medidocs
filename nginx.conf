server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  location = /health {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(css|js|svg)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable";
  }
}
